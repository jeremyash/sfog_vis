name: Build NDFD superfog cache

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ndfd-superfog-cache
  cancel-in-progress: true

jobs:
  build-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Check out cache branch
        uses: actions/checkout@v4
        with:
          ref: cache-data
          path: cache-repo

      - name: Install spatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::terra
            any::sf
            any::lubridate
            any::png
            any::openssl

      - name: Build cache
        run: |
          cd main-repo
          Rscript scripts/build_ndfd_superfog_cache.R

      - name: Copy cache to cache branch
        run: |
          mkdir -p cache-repo/cache
          cp main-repo/cache/ndfd_superfog_cache.rds cache-repo/cache/
          
      - name: Commit updated cache
        run: |
          cd cache-repo
      
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          git add cache/ndfd_superfog_cache.rds
          git commit -m "Update NDFD superfog cache" || echo "No changes to commit"
          git push origin cache-data